# The desktop app's Rust layer: clippy with warnings denied, then cargo test.
# macOS only (the crate links macOS frameworks), and a macOS runner bills at ten times
# the Linux rate, so this runs only when the Rust layer or this check changes.
name: Desktop Rust

on:
  pull_request:
    paths:
      - apps/desktop/src-tauri/**
      - apps/desktop/package.json
      - apps/desktop/scripts/sparkle.mjs
      - .github/workflows/desktop-rust.yml
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/**
      - apps/desktop/package.json
      - apps/desktop/scripts/sparkle.mjs
      - .github/workflows/desktop-rust.yml

permissions:
  contents: read

concurrency:
  group: desktop-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm --filter @plaintask/desktop check:rust
