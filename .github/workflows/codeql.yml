name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on main always finish.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR analyzes only the languages its files touch. Push, schedule and dispatch analyze all.
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo 'matrix=["actions","javascript-typescript","rust"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          touches() { grep -qE "$1" <<< "$files"; }
          all='^\.github/workflows/codeql\.yml$'
          langs=()
          if touches "$all" || touches '^\.github/(workflows|actions)/|(^|/)action\.ya?ml$'; then langs+=(actions); fi
          if touches "$all" || touches '\.(js|mjs|cjs|jsx|ts|mts|cts|tsx|vue|html?)$|(^|/)(package\.json|tsconfig[^/]*\.json)$'; then langs+=(javascript-typescript); fi
          if touches "$all" || touches '^apps/desktop/src-tauri/'; then langs+=(rust); fi
          echo "matrix=$(jq -cn '$ARGS.positional' --args "${langs[@]}")" >> "$GITHUB_OUTPUT"

  analyze:
    needs: languages
    if: needs.languages.outputs.matrix != '[]'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
