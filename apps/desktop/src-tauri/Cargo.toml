[package]
name = "plaintask"
version = "0.0.0"
description = "Plaintask desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The security-scoped bookmark that remembers the task folder (src/folder.rs) is a Foundation API.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString", "NSURL"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
