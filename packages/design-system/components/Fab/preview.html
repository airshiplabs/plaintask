<!-- @dsCard group="Actions" height=96 subtitle="Click to toggle" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fab</title>
<style>body { margin: 0; background: var(--surface); } .stage { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }</style>
</head>
<body class="pt-root">
<div class="stage" id="s"></div>
<script>
var P = window.Plaintask;
document.getElementById('s').innerHTML = P.Fab({}) + P.Fab({ expanded: true, label: 'Close new task' });
var b = document.querySelectorAll('.pt-fab')[0];
b.onclick = function () { b.setAttribute('aria-expanded', b.getAttribute('aria-expanded') !== 'true'); };
</script>
</body>
</html>
