<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title>
<style>body { margin: 0; background: var(--surface); } .stage { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }</style>
</head>
<body class="pt-root">
<div class="stage" id="s"></div>
<script>
var P = window.Plaintask;
document.getElementById('s').innerHTML = P.Button({ label: 'New task', variant: 'primary', icon: 'plus', kbd: 'N' }) + P.Button({ label: 'Add task', variant: 'primary' }) + P.Button({ label: 'Show' }) + P.Button({ label: 'Cancel', variant: 'ghost' }) + P.Button({ label: 'Close', icon: 'close', iconOnly: true, variant: 'ghost' });
</script>
</body>
</html>
