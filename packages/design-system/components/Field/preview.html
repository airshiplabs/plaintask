<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Field</title>
<style>body { margin: 0; background: var(--surface); } .stage { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }</style>
</head>
<body class="pt-root">
<div class="stage" id="s" style="display:grid;grid-template-columns:1fr 1fr;align-items:start"></div>
<script>
var P = window.Plaintask;
document.getElementById('s').innerHTML = P.Field({ id: 'f1', name: 'title', label: 'Task', placeholder: 'e.g. Call the tiler' }) +
  P.Field({ id: 'f2', name: 'when', label: 'When', options: [['0', 'Today', true], ['1', 'Tomorrow'], ['someday', 'Someday']] }) +
  '<div>' + P.Field({ id: 'f3', name: 'bad', label: 'Task', invalid: true }) + '<p class="pt-error">Give the task a name first.</p></div>';
</script>
</body>
</html>
